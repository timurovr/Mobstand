# When you publish a GitHub Release (e.g. tag v1.1), this builds the mod and attaches the .jar to that release.
# The jar's version comes from the tag: v1.1 -> mobstands-1.1.jar (and the version shown in-game).
name: Build release jar

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Version from the tag
        run: echo "MOD_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build -Pmod_version="$MOD_VERSION" --no-daemon

      - name: Attach the jar to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls build/libs
          for f in build/libs/*.jar; do
            case "$f" in *-sources.jar|*-javadoc.jar) continue ;; esac
            gh release upload "$GITHUB_REF_NAME" "$f" --clobber
          done
