# When you publish a GitHub Release (e.g. tag v1.1), this builds the mod and attaches the .jar to that release.
# The jar's version comes from the tag: v1.1 -> mobstands-1.1.jar (and the version shown in-game).
name: Build release jar

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Version from the tag
        run: |
          V="${GITHUB_REF_NAME#v}"
          echo "MOD_VERSION=${V#V}" >> "$GITHUB_ENV"

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build -Pmod_version="$MOD_VERSION" --no-daemon

      - name: Attach the jar and the versions to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MC=$(grep '^minecraft_version=' gradle.properties | cut -d= -f2)
          NEO=$(grep '^neo_version=' gradle.properties | cut -d= -f2)
          ls build/libs
          for f in build/libs/*.jar; do
            case "$f" in *-sources.jar|*-javadoc.jar) continue ;; esac
            out="build/libs/mobstands-${MOD_VERSION}-mc${MC}-neoforge.jar"
            [ "$f" = "$out" ] || cp "$f" "$out"
            gh release upload "$GITHUB_REF_NAME" "$out" --clobber
          done
          # Add the versions to the release notes (once).
          gh release view "$GITHUB_REF_NAME" --json body -q .body > notes.md
          if ! grep -q '^## Versions' notes.md; then
            printf '\n\n## Versions\n| | |\n|---|---|\n| Mod | %s |\n| Minecraft | %s |\n| NeoForge | %s or newer 21.1.x |\n| Java | 21 |\n' \
              "$MOD_VERSION" "$MC" "$NEO" >> notes.md
            gh release edit "$GITHUB_REF_NAME" --notes-file notes.md
          fi
